[project]
name = "idc-backend"
version = "0.1.0"
description = "T2 Intelligent Document Confidence Reviewer (FastAPI + MongoDB)"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = ["."]



[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}

pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"

motor = "^3.5.1"
beanie = {version = "^1.30.0", extras = ["motor"]}

python-multipart = "^0.0.9"

httpx = "^0.27.0"

tenacity = "^9.0.0"

structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"

mypy = "^1.11.2"
ruff = "^0.6.9"
black = "^24.8.0"


name: Dependency Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install pip-audit
          pip-audit || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: |
          cd frontend
          npm install
          npm audit || true
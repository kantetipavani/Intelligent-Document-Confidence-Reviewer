name: Dependency Check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  dependency-backend:
    name: Backend Dependency Check (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          # Non-blocking: do not fail CI on vulnerabilities
          pip-audit || true

  dependency-frontend:
    name: Frontend Dependency Check (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: npm audit (production)
        working-directory: frontend
        run: npm audit --production


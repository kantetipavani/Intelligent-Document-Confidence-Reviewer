name: Lint

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        working-directory: backend
        run: |
          pip install ruff
          ruff check .


      - name: Black (check)
        working-directory: backend
        run: |
          pip install black
          black --check .


      - name: Mypy (type check)
        working-directory: backend
        run: |
          pip install mypy
          mypy app


  lint-frontend:
    name: Lint (Frontend - build sanity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (sanity)
        working-directory: frontend
        run: npm run build


services:
  mongo:
    image: mongo:7.0

    container_name: indcr-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-express:
    # Pin image tag to avoid Docker Desktop issues with `latest` pulls.
    image: mongo-express:1.0.0-alpha.4
    container_name: indcr-mongo-express
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      # Local inspection only (no secrets hardcoded).
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""


  redis:
    image: redis:7-alpine


    container_name: indcr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: indcr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indcr-backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-idc_dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-secret}
      SKIP_DB: ${SKIP_DB:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STRICT: ${SMTP_STRICT:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; import sys; sys.exit(0 if r.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Legacy Celery worker (kept for backward compatibility; extraction trigger uses Kafka by default)
  celery_worker:
    image: indcr-celery-worker:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: indcr-celery-worker
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-idc_dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-secret}
      SKIP_DB: ${SKIP_DB:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["celery", "-A", "app.celery_worker_entrypoint", "worker", "-l", "INFO", "-Q", "extraction"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    ports:
      - "2181:2181"
    container_name: indcr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "127.0.0.1:2181", "2"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: indcr-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "1", "2", "-b", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 25s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: indcr-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  kafka_extraction_consumer:
    image: indcr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indcr-kafka-extraction-consumer
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EXTRACTION_REQUESTS: invoice_extraction_requested
      KAFKA_CONSUMER_GROUP_ID: idc-extraction-consumer
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-idc_dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-secret}
      SKIP_DB: ${SKIP_DB:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["python", "-m", "app.workers.kafka_extraction_consumer"]

  grpc_extraction_server:
    image: indcr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indcr-grpc-extraction-server
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-idc_dev}
      SKIP_DB: ${SKIP_DB:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 50051)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "50051:50051"
    command: ["python", "-m", "app.grpc.server_entrypoint"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: indcr-jaeger
    ports:
      - "16686:16686" # UI

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: indcr-otel-collector
    environment:
      COLLECTOR_OTLP_ENABLED: true
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  flower:
    image: mher/flower:2.0.1
    container_name: indcr-flower
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"  

  frontend:
    image: indcr-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: indcr-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (res) => { process.exit(res.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:



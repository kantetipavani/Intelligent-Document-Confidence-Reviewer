services:
  mongo:
    image: mongo:7
    container_name: indcr-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-express:
    # Pin image tag to avoid Docker Desktop issues with `latest` pulls.
    image: mongo-express:1.0.0-alpha.4
    container_name: indcr-mongo-express
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      # Local inspection only (no secrets hardcoded).
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indcr-backend
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB}
      JWT_SECRET: ${JWT_SECRET}
      SKIP_DB: ${SKIP_DB}
    # Uvicorn listens on 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indcr-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

volumes:
  mongo_data:

